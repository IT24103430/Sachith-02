name: Refresh GitHub Stats

on:
  schedule:
    - cron: "45 */6 * * *"
  push:
    branches: [main]
    paths:
      - .github/scripts/generate_github_stats.py
      - .github/scripts/update_profile.py
      - .github/workflows/refresh-github-stats.yml
      - profile.config.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-github-stats
  cancel-in-progress: true

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate public statistics cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/generate_github_stats.py
      - name: Publish cached cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-languages.svg
          if ! git diff --staged --quiet; then
            git commit -m "Refresh public GitHub statistics [skip ci]"
            git pull --rebase origin main
            git push
          fi
