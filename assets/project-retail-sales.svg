<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Retail Sales Analytics · From data to decisions</title>
  <desc id="desc">Synthetic retail CSVs feed two branches. Completed Python work checks data quality and calculates business insights. Prepared BI assets include Power Query, a star-schema design, DAX measures, and three report page specifications. Power BI Desktop build and verification are pending.</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#58a6ff"/></marker>
    <marker id="purple-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#a371f7"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
      .title{font-size:24px;font-weight:700}
      .label{font-size:18px;font-weight:600}
      .node{font-size:23px;font-weight:600;text-anchor:middle}
      .detail{font-size:17px;fill:#a0aec0;text-anchor:middle}
      .badge{font-size:13px;font-weight:700;letter-spacing:1px;text-anchor:middle}
      .flow{fill:none;stroke:#58a6ff;stroke-width:2;marker-end:url(#blue-arrow)}
      .planned{fill:none;stroke:#a371f7;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#purple-arrow)}
      @media(prefers-reduced-motion:reduce){.packet{display:none}}
    </style>
  </defs>
  <rect width="900" height="540" rx="12" fill="#0b1120"/>
  <text x="30" y="38" class="title">Retail Sales Analytics</text>
  <text x="870" y="36" text-anchor="end" font-size="15" fill="#a0aec0">DATA → INSIGHTS → REPORT DESIGN</text>

  <!-- One source, two honest branches: executed analysis and prepared BI assets. -->
  <rect x="218" y="66" width="464" height="80" rx="12" fill="#102542" stroke="#58a6ff" stroke-width="1.5"/>
  <g transform="translate(242 86)" fill="none" stroke="#58a6ff" stroke-width="2">
    <ellipse cx="16" cy="5" rx="16" ry="5"/>
    <path d="M0 5v27c0 7 32 7 32 0V5M0 18c0 7 32 7 32 0"/>
  </g>
  <text x="478" y="98" class="node">Synthetic retail CSVs</text>
  <text x="478" y="125" class="detail">5,000 order lines · 9 regions · 4 channels</text>
  <path class="flow" d="M450 146V168H232V188"/>
  <path class="planned" d="M450 168H668V188"/>
  <circle cx="450" cy="168" r="4" fill="#58a6ff"/>

  <rect x="28" y="190" width="408" height="318" rx="14" fill="#0e1828" stroke="#29364d"/>
  <text x="48" y="219" class="label" style="fill:#58a6ff">PYTHON ANALYSIS</text>
  <rect x="316" y="202" width="100" height="24" rx="12" fill="#12281d"/>
  <text x="366" y="219" class="badge" style="fill:#3fb950">COMPLETE</text>
  <rect x="48" y="240" width="368" height="70" rx="10" fill="#102542" stroke="#58a6ff"/>
  <text x="232" y="269" class="node">Data quality checks</text>
  <text x="232" y="294" class="detail">Missing values · Keys · Consistency</text>
  <path class="flow" d="M232 310V338"/>
  <rect x="48" y="340" width="368" height="76" rx="10" fill="#12281d" stroke="#3fb950"/>
  <text x="232" y="370" class="node">Calculated business insights</text>
  <text x="232" y="397" class="detail">Revenue · Profit · Products · Regions</text>
  <text x="232" y="455" class="detail" style="fill:#3fb950">Reproducible analysis in Python</text>
  <text x="232" y="481" class="detail">Synthetic results · Values in LKR</text>

  <rect x="464" y="190" width="408" height="318" rx="14" fill="#0e1828" stroke="#29364d"/>
  <text x="484" y="219" class="label" style="fill:#a371f7">BI REPORT DESIGN</text>
  <rect x="750" y="202" width="102" height="24" rx="12" fill="#241a3d"/>
  <text x="801" y="219" class="badge" style="fill:#bc9af9">PREPARED</text>
  <rect x="484" y="240" width="368" height="70" rx="10" fill="#241a3d" stroke="#a371f7"/>
  <text x="668" y="269" class="node">Power Query + Star schema</text>
  <text x="668" y="294" class="detail">M scripts · Fact + dimension design</text>
  <path class="planned" d="M668 310V338"/>
  <rect x="484" y="340" width="368" height="76" rx="10" fill="#241a3d" stroke="#a371f7"/>
  <text x="668" y="370" class="node">DAX + Report specifications</text>
  <text x="668" y="397" class="detail">Executive · Product · Region/channel</text>
  <rect x="484" y="438" width="368" height="48" rx="9" fill="#2e2412"/>
  <circle cx="505" cy="462" r="4" fill="#d29922"/>
  <text x="675" y="468" class="detail" style="fill:#e3b341">Power BI Desktop build pending</text>

  <g class="packet" fill="#58a6ff">
    <circle r="4"><animateMotion dur="3.5s" repeatCount="indefinite" path="M450 146V168H232V188"/></circle>
    <circle r="3"><animateMotion dur="1.6s" repeatCount="indefinite" path="M232 310V338"/></circle>
  </g>
</svg>
