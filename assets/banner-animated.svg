<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sachith Asmadala - Computer Science undergraduate at SLIIT, focused on DevOps, software engineering and AI/ML" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363d" stroke-opacity="0.45" stroke-width="1"/>
    </pattern>
    <clipPath id="typeClip">
      <rect x="80" y="196" width="0" height="40">
        <animate attributeName="width" from="0" to="660" dur="2.6s" begin="0.8s" fill="freeze" calcMode="discrete" values="0;35;69;104;139;174;208;243;278;313;347;382;417;452;486;521;556;591;625;660" keyTimes="0;0.05;0.1;0.15;0.2;0.25;0.3;0.35;0.4;0.45;0.5;0.55;0.6;0.65;0.7;0.75;0.8;0.85;0.9;1"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .name { font: 700 58px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f0f6fc; }
    .tag  { font: 500 14px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #58a6ff; letter-spacing: 3px; }
    .role { font: 500 26px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #c9d1d9; }
    .meta { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #8b949e; }
    .fade1 { opacity: 0; animation: fadeUp 0.9s ease-out 0.1s forwards; }
    .fade2 { opacity: 0; animation: fadeUp 0.9s ease-out 0.4s forwards; }
    .fade3 { opacity: 0; animation: fadeUp 0.9s ease-out 3.6s forwards; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .code { font: 400 13px 'SFMono-Regular', Consolas, monospace; fill: #6e7681; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-40px); } }
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <g style="animation: drift 6s linear infinite"><rect x="0" y="0" width="1280" height="320" fill="url(#grid)"/></g>

  <!-- ambient glows -->
  <circle cx="1020" cy="80" r="220" fill="url(#glowBlue)">
    <animate attributeName="cx" values="1020;960;1020" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;130;80" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="270" r="200" fill="url(#glowPurple)">
    <animate attributeName="cx" values="1100;1040;1100" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- floating code symbols -->
  <g class="code">
    <text x="900" y="90">&lt;/&gt;
      <animate attributeName="y" values="90;76;90" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="1010" y="170">{ }
      <animate attributeName="y" values="170;154;170" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="940" y="250">git commit
      <animate attributeName="y" values="250;238;250" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="1090" y="230">=&gt;
      <animate attributeName="y" values="230;216;230" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="4.5s" repeatCount="indefinite"/>
    </text>
    <text x="1120" y="110">01
      <animate attributeName="y" values="110;96;110" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- text -->
  <text class="tag fade1" x="80" y="82">COMPUTER SCIENCE  /  SLIIT</text>
  <text class="name fade2" x="80" y="160">Sachith Asmadala</text>
  <rect x="80" y="174" width="140" height="4" rx="2" fill="url(#accent)" class="fade2">
    <animate attributeName="width" values="40;180;40" dur="5s" repeatCount="indefinite"/>
  </rect>

  <g clip-path="url(#typeClip)">
    <text class="role" x="80" y="224">DevOps  ·  Software Engineering  ·  AI/ML</text>
  </g>
  <rect class="cursor" x="80" y="200" width="3" height="30" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.01s" fill="freeze"/>
    <animate attributeName="x" dur="2.6s" begin="0.8s" fill="freeze" calcMode="discrete" values="80;115;149;184;219;254;288;323;358;393;427;462;497;532;566;601;636;671;705;740" keyTimes="0;0.05;0.1;0.15;0.2;0.25;0.3;0.35;0.4;0.45;0.5;0.55;0.6;0.65;0.7;0.75;0.8;0.85;0.9;1"/>
  </rect>

  <text class="meta fade3" x="80" y="278">Computer Science undergraduate  ·  Open to DevOps, Software Engineering and AI/ML internships</text>

  <!-- bottom accent line -->
  <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>
</svg>
