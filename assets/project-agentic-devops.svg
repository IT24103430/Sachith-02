<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">DevOps assistant architecture</title>
  <desc id="d">A user works through a React frontend and FastAPI backend with auth and RBAC. The backend routes to a multi-agent layer and a service layer. Agents integrate with GitHub, services persist to a database and Redis, and webhook events return to the backend.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--line)"/></marker>
    <style>
      :root{--bg:#0b1120;--card:#111b2e;--stroke:#29364d;--text:#e6edf3;--muted:#a0aec0;--line:#8b949e;
        --ai:#a371f7;--ai-bg:#241a3d;--svc:#3fb950;--svc-bg:#12281d;--ext:#d29922;--ext-bg:#2e2412;--core:#58a6ff;--core-bg:#102542}
      text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;fill:var(--text);text-anchor:middle}
      .bg{fill:var(--bg)}
      .n{fill:var(--card);stroke:var(--stroke);stroke-width:1.2}
      .core{fill:var(--core-bg);stroke:var(--core)}
      .ai{fill:var(--ai-bg);stroke:var(--ai)}
      .svc{fill:var(--svc-bg);stroke:var(--svc)}
      .ext{fill:var(--ext-bg);stroke:var(--ext)}
      .grp{fill:none;stroke-width:1.5;stroke-dasharray:5 4}
      .ln{fill:none;stroke:var(--line);stroke-width:1.5;marker-end:url(#a)}
      .dash{stroke-dasharray:5 4}
      .gl{font-size:12px;font-weight:700;letter-spacing:.1em;text-anchor:start}
      .ttl{font-size:18px;font-weight:700;text-anchor:start}
      .sm{font-size:12px;fill:var(--muted)}

      @keyframes flow{to{stroke-dashoffset:-22}}
      @keyframes march{to{stroke-dashoffset:-18}}
      @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @keyframes glow{0%,100%{opacity:1}50%{opacity:.55}}
      .ln{stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
      .grp{animation:march 2.2s linear infinite}
      .e1{animation:rise .6s ease-out backwards}
      .e2{animation:rise .6s ease-out .25s backwards}
      .e3{animation:rise .6s ease-out .5s backwards}
      .e4{animation:rise .6s ease-out .75s backwards}
      .e5{animation:rise .6s ease-out 1s backwards}
      .pulse{animation:glow 2.4s ease-in-out infinite}
      .pkt{filter:drop-shadow(0 0 3px currentColor)}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.pkt{display:none}}
    </style>
  </defs>
  <rect class="bg" width="900" height="540" rx="12"/>
  <text x="30" y="36" class="ttl">DevOps Assistant · Architecture</text>

  <!-- Entry row -->
  <g class="e1">
  <rect class="n" x="30" y="58" width="130" height="46" rx="8"/><text x="95" y="87">User</text>
  <rect class="n core" x="210" y="58" width="170" height="46" rx="8"/><text x="295" y="87">React Frontend</text>
  <rect class="n core pulse" x="430" y="58" width="190" height="46" rx="8"/><text x="525" y="87">FastAPI Backend</text>
  <rect class="n" x="670" y="58" width="200" height="46" rx="8"/><text x="770" y="87">Auth + RBAC</text>
  <path class="ln" d="M160 81H210"/><path class="ln" d="M380 81H430"/><path class="ln" d="M620 81H670"/>

  </g>

  <!-- Bus -->
  <path d="M525 104V134H240V160" class="ln"/>
  <path d="M525 134H660V160" class="ln"/>

  <g class="e2">
  <!-- Multi-agent group -->
  <rect class="grp ai" x="30" y="160" width="420" height="170" rx="12" style="stroke:var(--ai)"/>
  <text x="46" y="184" class="gl" style="fill:var(--ai)">MULTI-AGENT LAYER</text>
  <rect class="n ai" x="46" y="200" width="190" height="44" rx="8"/><text x="141" y="228">CLI Agent</text>
  <rect class="n ai" x="244" y="200" width="190" height="44" rx="8"/><text x="339" y="228">CI/CD Agent</text>
  <rect class="n ai" x="46" y="262" width="190" height="44" rx="8"/><text x="141" y="290">Diagnosis Agent</text>
  <rect class="n ai" x="244" y="262" width="190" height="44" rx="8"/><text x="339" y="290">GitHub Agent</text>

  </g>
  <g class="e3">
  <!-- Service group -->
  <rect class="grp svc" x="470" y="160" width="400" height="170" rx="12" style="stroke:var(--svc)"/>
  <text x="486" y="184" class="gl" style="fill:var(--svc)">SERVICE LAYER</text>
  <rect class="n svc" x="486" y="200" width="118" height="44" rx="8"/><text x="545" y="218" class="sm" style="fill:var(--text);font-size:13px">Repository</text><text x="545" y="234" style="font-size:13px">Analyzer</text>
  <rect class="n svc" x="612" y="200" width="118" height="44" rx="8"/><text x="671" y="218" style="font-size:13px">Workflow</text><text x="671" y="234" style="font-size:13px">Generator</text>
  <rect class="n svc" x="738" y="200" width="116" height="44" rx="8"/><text x="796" y="227" style="font-size:13px">Failure Model</text>
  <rect class="n svc" x="486" y="262" width="180" height="44" rx="8"/><text x="576" y="290">Approval Service</text>
  <rect class="n svc" x="674" y="262" width="180" height="44" rx="8"/><text x="764" y="290">Audit Service</text>

  </g>

  <!-- Down arrows -->
  <path class="ln" d="M240 330V390"/>
  <path class="ln" d="M660 330V390"/>

  <g class="e4">
  <!-- GitHub group -->
  <rect class="grp ext" x="30" y="390" width="420" height="110" rx="12" style="stroke:var(--ext)"/>
  <text x="46" y="414" class="gl" style="fill:var(--ext)">GITHUB</text>
  <rect class="n ext" x="46" y="430" width="170" height="52" rx="8"/><text x="131" y="462">GitHub API</text>
  <rect class="n ext" x="264" y="430" width="170" height="52" rx="8"/><text x="349" y="462">GitHub Webhooks</text>
  <path class="ln" d="M216 456H264"/>

  </g>
  <g class="e5">
  <!-- Data group -->
  <rect class="grp" x="470" y="390" width="400" height="110" rx="12" style="stroke:var(--line)"/>
  <text x="486" y="414" class="gl" style="fill:var(--muted)">DATA</text>
  <rect class="n" x="486" y="430" width="170" height="52" rx="8"/><text x="571" y="462">Database</text>
  <rect class="n" x="680" y="430" width="174" height="52" rx="8"/><text x="767" y="462">Redis</text>

  </g>

  <!-- Webhook events back to backend -->
  <path class="ln dash" d="M450 445H460V134H525"/>
  <text x="456" y="520" class="sm" style="text-anchor:middle">webhook events return to FastAPI</text>

  <!-- Travelling request packets -->
  <g class="pkt">
    <circle r="5" style="fill:var(--core);color:var(--core)"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.2s" path="M95 81H525"/></circle>
    <circle r="5" style="fill:var(--ai);color:var(--ai)"><animateMotion dur="2.6s" repeatCount="indefinite" begin="2.4s" path="M525 104V134H240V200"/></circle>
    <circle r="5" style="fill:var(--ext);color:var(--ext)"><animateMotion dur="1.6s" repeatCount="indefinite" begin="3.6s" path="M240 330V390"/></circle>
    <circle r="5" style="fill:var(--svc);color:var(--svc)"><animateMotion dur="2.2s" repeatCount="indefinite" begin="2.9s" path="M525 134H660V200"/></circle>
    <circle r="5" style="fill:var(--line);color:var(--line)"><animateMotion dur="1.6s" repeatCount="indefinite" begin="4s" path="M660 330V390"/></circle>
    <circle r="5" style="fill:var(--ext);color:var(--ext)"><animateMotion dur="3s" repeatCount="indefinite" begin="5s" path="M450 445H460V134H525"/></circle>
  </g>
</svg>
