<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title description">
  <title id="title">Agentic DevOps Assistant · CI/CD workflow</title>
  <desc id="description">A React workspace connects to FastAPI with authentication and role checks. GitHub API calls and webhooks connect repositories and workflow events. An orchestration agent routes work to CLI, CI/CD, diagnosis, and GitHub agents for repository analysis, workflow generation, and ML failure diagnosis. Proposed changes go through human review and approval before a pull request is created. Actions are audit logged.</desc>
  <defs>
    <linearGradient id="orchestrator" x1="0" x2="1">
      <stop stop-color="#18223d"/>
      <stop offset="1" stop-color="#251b3c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#8396b2"/>
    </marker>
    <style>
      text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3;text-anchor:middle}
      .title{font-size:21px;font-weight:700;text-anchor:start}
      .label{font-size:18px;font-weight:600}
      .detail{font-size:15px;fill:#a8b7cc}
      .footer{font-size:13px;fill:#a8b7cc}
      .node{stroke-width:1.3}
      .core{fill:#102542;stroke:#58a6ff}
      .agent{fill:#241a3d;stroke:#a371f7}
      .service{fill:#12281d;stroke:#3fb950}
      .external{fill:#2e2412;stroke:#d29922}
      .neutral{fill:#111b2e;stroke:#53647c}
      .route{fill:none;stroke:#8396b2;stroke-width:1.7;stroke-dasharray:6 5;marker-end:url(#arrow);animation:flow 1.6s linear infinite}
      .bus{fill:none;stroke:#53647c;stroke-width:1.5}
      .halo{fill:none;stroke:#a371f7;stroke-width:1.5;animation:halo 3s ease-in-out infinite}
      .packet{filter:drop-shadow(0 0 3px currentColor)}
      @keyframes flow{to{stroke-dashoffset:-22}}
      @keyframes halo{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}.packet{display:none}}
    </style>
  </defs>
  <rect width="900" height="540" rx="12" fill="#0b1120"/>
  <text x="30" y="36" class="title">Agentic DevOps Assistant · Architecture</text>

  <!-- Interface and repository integration -->
  <rect x="30" y="66" width="240" height="62" rx="9" class="node core"/>
  <text x="150" y="92" class="label">React Workspace</text>
  <text x="150" y="113" class="detail">Scan repos · inspect failures</text>
  <rect x="330" y="66" width="240" height="62" rx="9" class="node core"/>
  <text x="450" y="92" class="label">FastAPI</text>
  <text x="450" y="113" class="detail">Authentication + RBAC</text>
  <rect x="630" y="66" width="240" height="62" rx="9" class="node external"/>
  <text x="750" y="92" class="label">GitHub Integration</text>
  <text x="750" y="113" class="detail">API calls + webhook events</text>
  <path d="M270 97H330" class="route"/>
  <path d="M570 97H630" class="route" marker-start="url(#arrow)"/>
  <path d="M450 128V170" class="route"/>

  <!-- Routing layer -->
  <rect x="30" y="170" width="840" height="76" rx="11" fill="url(#orchestrator)"/>
  <rect x="30" y="170" width="840" height="76" rx="11" class="halo"/>
  <text x="450" y="200" class="label">Orchestration Agent</text>
  <text x="450" y="225" class="detail">Routes tasks to CLI · CI/CD · Diagnosis · GitHub agents</text>
  <path d="M450 246V266M155 266H745" class="bus"/>
  <path d="M155 266V288" class="route"/>
  <path d="M450 266V288" class="route"/>
  <path d="M745 266V288" class="route"/>

  <!-- Three complementary capabilities -->
  <rect x="30" y="288" width="250" height="88" rx="9" class="node core"/>
  <text x="155" y="319" class="label">Repository Analysis</text>
  <text x="155" y="343" class="detail">Stack + CI/CD readiness</text>
  <text x="155" y="363" class="detail">Existing workflow checks</text>
  <rect x="325" y="288" width="250" height="88" rx="9" class="node service"/>
  <text x="450" y="319" class="label">Workflow Generation</text>
  <text x="450" y="343" class="detail">GitHub Actions YAML</text>
  <text x="450" y="363" class="detail">Stack-aware configuration</text>
  <rect x="620" y="288" width="250" height="88" rx="9" class="node agent"/>
  <text x="745" y="319" class="label">ML Failure Diagnosis</text>
  <text x="745" y="343" class="detail">TF-IDF + Logistic Regression</text>
  <text x="745" y="363" class="detail">Failure category + suggested fix</text>

  <!-- Proposed changes converge on review; no automatic merge -->
  <path d="M155 376V402H745V376M450 376V402" class="bus"/>
  <path d="M155 402V430" class="route"/>
  <rect x="30" y="430" width="250" height="64" rx="9" class="node external"/>
  <text x="155" y="457" class="label">Review + Approval</text>
  <text x="155" y="480" class="detail">Human control over changes</text>
  <rect x="325" y="430" width="250" height="64" rx="9" class="node service"/>
  <text x="450" y="457" class="label">Fix Pull Request</text>
  <text x="450" y="480" class="detail">Branch · commit · propose</text>
  <rect x="620" y="430" width="250" height="64" rx="9" class="node neutral"/>
  <text x="745" y="457" class="label">Audit Trail</text>
  <text x="745" y="480" class="detail">Actions · predictions · approvals</text>
  <path d="M280 462H325" class="route"/>
  <path d="M575 462H620" class="route"/>
  <text x="450" y="525" class="footer">Python · React · scikit-learn · Docker · GitHub Actions</text>

  <!-- Packets stay on connectors so labels remain readable. -->
  <g class="packet">
    <circle r="4" fill="#58a6ff" color="#58a6ff"><animateMotion dur="1.8s" repeatCount="indefinite" path="M270 97H330"/></circle>
    <circle r="4" fill="#d29922" color="#d29922"><animateMotion dur="2.2s" repeatCount="indefinite" path="M630 97H570"/></circle>
    <circle r="4" fill="#a371f7" color="#a371f7"><animateMotion dur="2s" repeatCount="indefinite" path="M450 128V170"/></circle>
    <circle r="4" fill="#58a6ff" color="#58a6ff"><animateMotion dur="3.1s" repeatCount="indefinite" path="M450 246V266H155V288"/></circle>
    <circle r="4" fill="#3fb950" color="#3fb950"><animateMotion dur="2.3s" repeatCount="indefinite" path="M450 246V288"/></circle>
    <circle r="4" fill="#a371f7" color="#a371f7"><animateMotion dur="3.4s" repeatCount="indefinite" path="M450 246V266H745V288"/></circle>
    <circle r="4" fill="#d29922" color="#d29922"><animateMotion dur="4.6s" repeatCount="indefinite" path="M745 376V402H155V430"/></circle>
    <circle r="4" fill="#3fb950" color="#3fb950"><animateMotion dur="1.9s" repeatCount="indefinite" path="M280 462H325"/></circle>
    <circle r="4" fill="#a8b7cc" color="#a8b7cc"><animateMotion dur="2.4s" repeatCount="indefinite" path="M575 462H620"/></circle>
  </g>
</svg>
