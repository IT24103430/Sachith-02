<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of an LLM agent orchestrating infrastructure provisioning, continuous delivery and system monitoring in a loop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-opacity="0.4"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
  </defs>
  <style>
    .t  { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #e6edf3; }
    .s  { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #8b949e; }
    .agent { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #fff; }
    .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .flow { stroke: url(#accent); stroke-width: 2.5; fill: none; stroke-dasharray: 7 8; animation: dash 1.5s linear infinite; }
    .in { opacity: 0; animation: appear .7s ease-out forwards; }
    .glow { animation: glow 3s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -30; } }
    @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>
  <rect width="1000" height="360" rx="14" fill="url(#bg)"/><rect width="1000" height="360" rx="14" fill="url(#grid)"/>

  <g class="in"><rect class="glow" x="340" y="28" width="320" height="64" rx="14" fill="url(#accent)"/>
    <text class="agent" x="500" y="66" text-anchor="middle">LLM Agent</text></g>

  <path class="flow" d="M420 92 L 195 168" marker-end="url(#arrow)"/>
  <path class="flow" d="M500 92 L 500 168" marker-end="url(#arrow)"/>
  <path class="flow" d="M580 92 L 805 168" marker-end="url(#arrow)"/>

  <g class="in" style="animation-delay:.3s"><rect class="box" x="60" y="170" width="270" height="92" rx="12"/>
    <text class="t" x="195" y="212" text-anchor="middle">Provision</text><text class="s" x="195" y="238" text-anchor="middle">Infrastructure setup</text></g>
  <g class="in" style="animation-delay:.5s"><rect class="box" x="365" y="170" width="270" height="92" rx="12"/>
    <text class="t" x="500" y="212" text-anchor="middle">Deliver</text><text class="s" x="500" y="238" text-anchor="middle">Continuous delivery</text></g>
  <g class="in" style="animation-delay:.7s"><rect class="box" x="670" y="170" width="270" height="92" rx="12"/>
    <text class="t" x="805" y="212" text-anchor="middle">Monitor</text><text class="s" x="805" y="238" text-anchor="middle">System monitoring</text></g>

  <path class="flow" d="M805 262 C 805 320, 195 320, 195 266" marker-end="url(#arrow)"/>
  <text class="s" x="500" y="340" text-anchor="middle">Agent-driven DevOps workflow in place of static scripts</text>
</svg>
