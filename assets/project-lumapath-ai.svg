<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of LumaPath AI's feature areas: AI mentoring, journaling, mood tracking, study planning, career roadmaps and smart reminders" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.45"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <style>
    .label { font: 600 17px 'Segoe UI', Arial, sans-serif; fill: #e6edf3; }
    .sub   { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #8b949e; }
    .core  { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
    .node  { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .flow  { stroke: url(#accent); stroke-width: 2; stroke-dasharray: 6 8; fill: none; animation: dash 1.6s linear infinite; }
    .pulse { transform-origin: 500px 180px; animation: pulse 3s ease-in-out infinite; }
    .in    { opacity: 0; animation: appear 0.7s ease-out forwards; }
    @keyframes dash   { to { stroke-dashoffset: -28; } }
    @keyframes pulse  { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.18); opacity: .4; } }
    @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <rect width="1000" height="360" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="360" rx="14" fill="url(#grid)"/>

  <!-- connectors -->
  <path class="flow" d="M500 180 C 400 180, 330 70, 250 70"/>
  <path class="flow" d="M500 180 L 250 180"/>
  <path class="flow" d="M500 180 C 400 180, 330 290, 250 290"/>
  <path class="flow" d="M500 180 C 600 180, 670 70, 750 70"/>
  <path class="flow" d="M500 180 L 750 180"/>
  <path class="flow" d="M500 180 C 600 180, 670 290, 750 290"/>

  <!-- core -->
  <circle class="pulse" cx="500" cy="180" r="78" fill="url(#glow)"/>
  <circle cx="500" cy="180" r="58" fill="url(#accent)"/>
  <text class="core" x="500" y="176" text-anchor="middle">LumaPath</text>
  <text class="core" x="500" y="202" text-anchor="middle">AI</text>

  <!-- left nodes -->
  <g class="in" style="animation-delay:.2s"><rect class="node" x="60" y="46" width="190" height="48" rx="12"/><text class="label" x="155" y="75" text-anchor="middle">AI Mentoring</text></g>
  <g class="in" style="animation-delay:.4s"><rect class="node" x="60" y="156" width="190" height="48" rx="12"/><text class="label" x="155" y="185" text-anchor="middle">Journaling</text></g>
  <g class="in" style="animation-delay:.6s"><rect class="node" x="60" y="266" width="190" height="48" rx="12"/><text class="label" x="155" y="295" text-anchor="middle">Mood Tracking</text></g>

  <!-- right nodes -->
  <g class="in" style="animation-delay:.3s"><rect class="node" x="750" y="46" width="190" height="48" rx="12"/><text class="label" x="845" y="75" text-anchor="middle">Study Planning</text></g>
  <g class="in" style="animation-delay:.5s"><rect class="node" x="750" y="156" width="190" height="48" rx="12"/><text class="label" x="845" y="185" text-anchor="middle">Career Roadmaps</text></g>
  <g class="in" style="animation-delay:.7s"><rect class="node" x="750" y="266" width="190" height="48" rx="12"/><text class="label" x="845" y="295" text-anchor="middle">Smart Reminders</text></g>

  <text class="sub" x="500" y="342" text-anchor="middle">Feature overview for university students: wellness, productivity, and career preparation</text>
</svg>
